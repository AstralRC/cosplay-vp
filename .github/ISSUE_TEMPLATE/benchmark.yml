name: Benchmark result
description: Real numbers for an open question (latency, matting quality, solve reliability...)
title: "[Benchmark] "
labels: [benchmark]
body:
  - type: input
    id: question
    attributes:
      label: Which open question (number from doc 09)?
    validations: { required: true }
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Hardware, software versions, resolution, frame rate, network
    validations: { required: true }
  - type: textarea
    id: method
    attributes:
      label: Method
      description: How you measured, and how many samples
    validations: { required: true }
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Median, worst case, and anything surprising
    validations: { required: true }
