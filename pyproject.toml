[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosplay-vp"
version = "0.1.0"
description = "Open-source tools, Claude skills and an MCP server for CG cosplay virtual production"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
keywords = ["virtual production", "unreal engine", "cosplay", "mcp", "colmap", "ffmpeg", "matting"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cosplay-vp-mcp = "cosplay_vp.server:main"
cosplay-vp-colmap2ue = "cosplay_vp.cli:colmap2ue"

[tool.setuptools.packages.find]
where = ["src"]
